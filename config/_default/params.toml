# -- Theme Options --
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "industry"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = false

enableA11y = false
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = false

replyByEmail = false

disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false

hotlinkFeatureImage = false

fingerprintAlgorithm = "sha512"

thumbnailAspectRatio = "1.78"

[header]
  layout = "fixed" # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur, floating

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = false
  showScrollToTop = true

[homepage]
  layout = "page" # overridden by the project's own layouts/index.html
  showRecent = true
  showRecentItems = 8
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = true

[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = true
  showHero = true
  heroStyle = "big" # required for showHero to actually render anything; matches the .single_hero_round duotone rule in custom.css
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  editAppendPath = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showReadingProgress = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 6
  showTaxonomies = true
  showCategories = true
  showTags = true
  showAuthorsBadges = false
  showWordCount = true
  showComments = true
  sharingLinks = ["linkedin", "bluesky", "reddit", "email"]
  showZenMode = true

[list]
  showHero = false
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = true
  showCards = true
  orderByWeight = false
  groupByYear = false
  cardView = true

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  cardView = true

[term]
  showHero = false
  showBreadcrumbs = false
  groupByYear = false
  cardView = true

# Giscus (GitHub Discussions) comments.
# Fill these in from https://giscus.app once Discussions are enabled on the repo.
[giscus]
  repo = "p0rkchop/synd1cate-blog"
  repoId = "REPLACE_ME"
  category = "Comments"
  categoryId = "REPLACE_ME"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  inputPosition = "top"
  theme = "noborder_light"
  lang = "en"

# Cloudflare Web Analytics.
# Fill in once the site is added in the Cloudflare dashboard (Analytics > Web Analytics).
[cloudflareAnalytics]
  token = "REPLACE_ME"
